name: meetlog
description: "A Flutter meeting log application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  
  flutter_riverpod: ^2.6.1
  
  go_router: ^14.6.0
  
  file_picker: ^10.3.10
  path_provider: ^2.1.1
  
  json_annotation: ^4.8.1
  
  fl_chart: ^0.66.0
  
  intl: ^0.19.0

  shared_preferences: ^2.3.3

  http: ^1.2.0
  package_info_plus: 4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  
  assets:
    - assets/png/

flutter_native_splash:
  color: "#ffffff"
  color_dark: "#1a1a2e"
  image: assets/png/Screen.png
  image_dark: assets/png/Screen.png
  android: true
  ios: true
  android_gravity: fill
  ios_content_mode: scaleAspectFit

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/png/logo.png"
