<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeetLog Pro 激活码生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            padding: 24px;
            text-align: center;
        }
        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        .content {
            padding: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            transition: border-color 0.3s;
        }
        .form-group textarea:focus {
            outline: none;
            border-color: #4CAF50;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4CAF50;
        }
        .row {
            display: flex;
            gap: 16px;
        }
        .row .form-group {
            flex: 1;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .result {
            margin-top: 20px;
            padding: 16px;
            background: #f5f5f5;
            border-radius: 8px;
            display: none;
        }
        .result.show {
            display: block;
        }
        .result.success {
            background: #e8f5e9;
            border: 1px solid #4CAF50;
        }
        .result.error {
            background: #ffebee;
            border: 1px solid #f44336;
        }
        .result h3 {
            margin-bottom: 12px;
            font-size: 16px;
        }
        .result pre {
            background: white;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .copy-btn {
            margin-top: 12px;
            padding: 8px 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .copy-btn:hover {
            background: #45a049;
        }
        .device-info {
            margin-top: 16px;
            padding: 12px;
            background: #e3f2fd;
            border-radius: 8px;
            font-size: 13px;
        }
        .device-info div {
            margin: 4px 0;
        }
        .device-info strong {
            color: #1976d2;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .loading.show {
            display: block;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .footer {
            text-align: center;
            padding: 16px;
            color: #666;
            font-size: 12px;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>MeetLog Pro 激活码生成器</h1>
            <p>离线激活 · 安全可靠</p>
        </div>
        <div class="content">
            <div class="form-group">
                <label for="request">设备激活请求</label>
                <textarea id="request" rows="4" placeholder="粘贴从 App 复制的设备激活请求..."></textarea>
            </div>
            <div class="row">
                <div class="form-group">
                    <label for="orderNo">订单号</label>
                    <input type="text" id="orderNo" placeholder="如: ORDER_20240101_001">
                </div>
                <div class="form-group">
                    <label for="expiresAt">过期时间 (可选)</label>
                    <input type="datetime-local" id="expiresAt">
                </div>
            </div>
            <button class="btn" id="generateBtn" onclick="generateLicense()">生成激活码</button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在生成激活码...</p>
            </div>
            
            <div class="result" id="result">
                <h3 id="resultTitle">生成结果</h3>
                <div class="device-info" id="deviceInfo"></div>
                <pre id="licenseCode"></pre>
                <button class="copy-btn" onclick="copyLicense()">复制激活码</button>
            </div>
        </div>
        <div class="footer">
            本工具仅供授权管理员使用 · 请妥善保管激活码
        </div>
    </div>

    <script src="js/license.js"></script>
</body>
</html>
